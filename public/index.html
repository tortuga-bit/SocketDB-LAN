<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi servidor HTTP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #aaa;
        }

        h1 {
            color: #333;
        }

        .info {
            text-align: left;
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 5px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Hola Tortuga</h1>

    <p>
        Bienvenido a mi servidor HTTP creado en C++. 
    </p>

    <div class="info">

        <p>
            <strong>IP del servidor:</strong>
            {{SERVER_IP}}
        </p>

        <p>
            <strong>IP del cliente:</strong>
            {{CLIENT_IP}}
        </p>

    </div>
    <div style="text-align: center;">
        <img src="image1.png" alt="Tortuga" width="300">
    </div>
</div>

</body>
</html>
